name: flutter_twemoji
description: Twemoji for Flutter, tracking the actively maintained jdecked/twemoji.
version: 1.2.0
repository: https://github.com/shiosyakeyakini-info/flutter_twemoji
issue_tracker: https://github.com/shiosyakeyakini-info/flutter_twemoji/issues
topics:
  - twemoji
  - emoji
  - flutter

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  characters: ^1.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.4
  io: ^1.0.3

  path: ^1.8.0
  yaml: ^3.1.0

dev_dependencies:

  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/png/
    - assets/svg/
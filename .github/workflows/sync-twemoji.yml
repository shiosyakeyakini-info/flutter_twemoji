name: Sync Twemoji

# Syncs the bundled assets and the generated emoji regex with jdecked/twemoji,
# the actively maintained successor of twitter/twemoji, and opens a pull request
# with the result. Started manually from the Actions tab, optionally pinned to a
# tag; without one the newest upstream release is used.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Twemoji tag to sync (defaults to the latest upstream release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-twemoji
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target release
        id: target
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          current="$(tool/sync_twemoji.sh --print-current)"
          ref="${REQUESTED_REF:-$(tool/sync_twemoji.sh --print-latest)}"
          if [ -z "$ref" ]; then
            echo "::error::Could not determine the latest Twemoji release"
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "Bundled: $current, upstream target: $ref"

      - name: Sync assets and emoji regex
        id: sync
        run: tool/sync_twemoji.sh --ref '${{ steps.target.outputs.ref }}'

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with Twemoji ${{ steps.target.outputs.ref }}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain | awk '{print $1}' | sort | uniq -c
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: chore/sync-twemoji-${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m 'chore: sync Twemoji assets with jdecked/twemoji ${{ steps.target.outputs.ref }}'
          # The branch is owned by this workflow, so re-running it for the same
          # release simply refreshes the open pull request.
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/sync-twemoji-${{ steps.target.outputs.version }}
          CURRENT: ${{ steps.target.outputs.current }}
          REF: ${{ steps.target.outputs.ref }}
          VERSION: ${{ steps.target.outputs.version }}
          PNG_COUNT: ${{ steps.sync.outputs.png_count }}
          SVG_COUNT: ${{ steps.sync.outputs.svg_count }}
          PARSER_VERSION: ${{ steps.sync.outputs.parser_version }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Refreshed the existing pull request #$existing"
            exit 0
          fi
          {
            echo "Automated sync with [jdecked/twemoji](https://github.com/jdecked/twemoji) \`$REF\`."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Bundled Twemoji | \`$CURRENT\` -> \`$VERSION\` |"
            echo "| Assets | $PNG_COUNT PNGs, $SVG_COUNT SVGs |"
            echo "| Emoji regex | generated from \`@twemoji/parser\` v$PARSER_VERSION |"
            echo
            echo "Upstream changes: https://github.com/jdecked/twemoji/compare/v$CURRENT...$REF"
            echo
            echo "Before publishing this to pub.dev:"
            echo
            echo "- [ ] Bump \`version\` in \`pubspec.yaml\`"
            echo "- [ ] Add a \`CHANGELOG.md\` entry"
            echo
            echo "Generated by \`.github/workflows/sync-twemoji.yml\`."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --head "$BRANCH" \
            --title "chore: sync Twemoji assets with jdecked/twemoji $REF" \
            --body-file "$RUNNER_TEMP/pr-body.md"

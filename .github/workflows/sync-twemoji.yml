name: Sync Twemoji

# Keeps the bundled assets and the generated emoji regex in sync with
# jdecked/twemoji, the actively maintained successor of twitter/twemoji.
# Runs weekly and opens a pull request whenever upstream published a new
# release. Can also be started manually, optionally pinned to a tag.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Twemoji tag to sync (defaults to the latest upstream release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-twemoji
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target release
        id: target
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          current="$(tool/sync_twemoji.sh --print-current)"
          ref="${REQUESTED_REF:-$(tool/sync_twemoji.sh --print-latest)}"
          if [ -z "$ref" ]; then
            echo "::error::Could not determine the latest Twemoji release"
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "Bundled: $current, upstream target: $ref"

      - name: Sync assets and emoji regex
        id: sync
        run: tool/sync_twemoji.sh --ref '${{ steps.target.outputs.ref }}'

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with Twemoji ${{ steps.target.outputs.ref }}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain | awk '{print $1}' | sort | uniq -c
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: chore/sync-twemoji-${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m 'chore: sync Twemoji assets with jdecked/twemoji ${{ steps.target.outputs.ref }}'
          # The branch is owned by this workflow, so re-running it for the same
          # release simply refreshes the open pull request.
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/sync-twemoji-${{ steps.target.outputs.version }}
          CURRENT: ${{ steps.target.outputs.current }}
          REF: ${{ steps.target.outputs.ref }}
          VERSION: ${{ steps.target.outputs.version }}
          PNG_COUNT: ${{ steps.sync.outputs.png_count }}
          SVG_COUNT: ${{ steps.sync.outputs.svg_count }}
          PARSER_VERSION: ${{ steps.sync.outputs.parser_version }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Refreshed the existing pull request #$existing"
            exit 0
          fi
          {
            echo "Automated sync with [jdecked/twemoji](https://github.com/jdecked/twemoji) \`$REF\`."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Bundled Twemoji | \`$CURRENT\` -> \`$VERSION\` |"
            echo "| Assets | $PNG_COUNT PNGs, $SVG_COUNT SVGs |"
            echo "| Emoji regex | generated from \`@twemoji/parser\` v$PARSER_VERSION |"
            echo
            echo "Upstream changes: https://github.com/jdecked/twemoji/compare/v$CURRENT...$REF"
            echo
            echo "Before publishing this to pub.dev:"
            echo
            echo "- [ ] Bump \`version\` in \`pubspec.yaml\`"
            echo "- [ ] Add a \`CHANGELOG.md\` entry"
            echo
            echo "Generated by \`.github/workflows/sync-twemoji.yml\`."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --head "$BRANCH" \
            --title "chore: sync Twemoji assets with jdecked/twemoji $REF" \
            --body-file "$RUNNER_TEMP/pr-body.md"

  # GitHub disables scheduled workflows in public repositories once the
  # repository has seen no commit for 60 days, and Twemoji releases are rarer
  # than that. Pushing an occasional empty commit to the default branch keeps
  # this workflow on its schedule. Only commits reset that timer -- opening
  # pull requests or pushing the sync branch does not.
  keepalive:
    needs: sync
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh repository activity
        env:
          MAX_IDLE_DAYS: '50'
        run: |
          set -euo pipefail
          idle_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$idle_days" -lt "$MAX_IDLE_DAYS" ]; then
            echo "Last commit on $GITHUB_REF_NAME was $idle_days days ago, nothing to do"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: keep the Twemoji sync schedule alive'
          git push origin "HEAD:$GITHUB_REF_NAME"
